# Réglages Mistral Vibe pour Devstral 2 (devstral-2512, « Devstral Medium 2512 »).
# Copié dans ~/.vibe/config.toml par le script d'installation.
# Vérifié avec mistral-vibe 3.0.1. Clés API : JAMAIS ici, seulement dans ~/.vibe/.env.

# Modèle utilisé au démarrage. Deux choix possibles (définis plus bas) :
#   "devstral-entreprise"  -> serveur de l'entreprise compatible OpenAI (vLLM, etc.), choix par défaut
#   "devstral"             -> API Mistral (clé MISTRAL_API_KEY)
active_model = "devstral-entreprise"

# Mode au démarrage : les modifications de fichiers passent seules,
# les commandes shell demandent ton accord. Shift+Tab pour changer de mode.
default_agent = "accept-edits"

# Pas d'envoi de statistiques d'usage à Mistral (code de l'entreprise).
enable_telemetry = false
# Mise à jour à la main (pip install -U mistral-vibe), pas toute seule.
enable_auto_update = false
# Pas de ligne « Generated by Mistral Vibe » ajoutée aux commits.
include_commit_signature = false
# Accepte les certificats installés par l'entreprise dans Windows (proxy HTTPS).
enable_system_trust_store = true

# ---------------------------------------------------------------- fournisseurs

[[providers]]
name = "mistral"
api_base = "https://api.mistral.ai/v1"
api_key_env_var = "MISTRAL_API_KEY"
backend = "mistral"

# Serveur de l'entreprise (compatible OpenAI). Remplace l'adresse par la vraie
# dans ~/.vibe/config.toml sur ton PC (jamais dans ce dépôt).
[[providers]]
name = "entreprise"
api_base = "https://ADRESSE-DU-SERVEUR/v1"
api_key_env_var = "ENTREPRISE_API_KEY"   # "" si le serveur ne demande pas de clé
api_style = "openai"
# Mets false si tu vois des erreurs « incomplete stream » avec ce serveur.
emits_finish_reason = true

# ---------------------------------------------------------------- modèles
# Réglages Devstral 2 : température basse (la fiche du modèle utilise 0,15),
# pas de mode « réflexion » (le modèle n'en a pas), fenêtre de 256k jetons.
# Résumé automatique (compaction) à 160k : le modèle reste plus précis
# qu'en remplissant toute la fenêtre.

[[models]]
name = "devstral-2512"
provider = "mistral"
alias = "devstral"
display_name = "Devstral 2 (API Mistral)"
temperature = 0.15
thinking = "off"
supports_images = false
max_context_length = 262144
auto_compact_threshold = 160000
max_output_tokens = 32768

[[models]]
# Nom exact du modèle tel que le serveur le donne (demande-le, ou regarde
# https://ADRESSE-DU-SERVEUR/v1/models). Avec vLLM c'est souvent celui-ci :
name = "mistralai/Devstral-2-123B-Instruct-2512"
provider = "entreprise"
alias = "devstral-entreprise"
display_name = "Devstral 2 (entreprise)"
temperature = 0.15
thinking = "off"
supports_images = false
max_context_length = 262144
auto_compact_threshold = 160000
max_output_tokens = 32768

# ---------------------------------------------------------------- outils
# Lire et chercher : sans demander (réglage d'origine).
# Shell : demande ton accord, sauf commandes en lecture seule (git status,
# git diff, git log, ls...), déjà autorisées par Vibe.
# Écrire : jamais dans les fichiers de secrets.

[tools.write_file]
denylist = ["**/.env", "**/*.pem", "**/*.key", "**/*.pfx", "**/id_rsa*", "**/id_ed25519*"]

[tools.edit]
denylist = ["**/.env", "**/*.pem", "**/*.key", "**/*.pfx", "**/id_rsa*", "**/id_ed25519*"]
